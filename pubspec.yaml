name: lozcam_movil
description: App móvil oficial de Grupo Lozcam — Sistema de Gestión de Obras
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Conexión a la MISMA base de datos Supabase que la web
  supabase_flutter: ^2.5.6
  # Memoria interna del dispositivo: usuarios locales + sesión persistente
  shared_preferences: ^2.2.0
  # GPS del dispositivo para validar la asistencia por ubicación
  geolocator: ^13.0.0
  # Mapa integrado dentro de la app (OpenStreetMap, sin API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Geocodificación de direcciones (Nominatim / OpenStreetMap)
  http: ^1.2.0
  # Foto de evidencia (cámara/galería). Se guarda local; subirá a Storage al integrar.
  image_picker: ^1.1.0
  # Tipografía de la interfaz (Inter para cuerpo, Lexend para títulos)
  google_fonts: ^6.2.1
  # Efecto skeleton durante cargas de listas
  shimmer: ^3.0.0
  # Reporte Excel (.xlsx) del monitoreo de gerencia (generado en el dispositivo)
  excel: ^4.0.0
  # Carpeta temporal para guardar el .xlsx antes de compartirlo
  path_provider: ^2.1.0
  # Compartir/guardar el archivo generado (no hay "descargar" en móvil)
  share_plus: ^10.0.0
  # Gráficas 2026 (líneas/barras) para los dashboards — MIT, sin licencia
  fl_chart: ^0.69.0
  # Micro-interacciones / animaciones premium (fade, slide, shimmer)
  flutter_animate: ^4.5.0
  pdf: ^3.12.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Fuente Unicode empaquetada. La usa el generador de PDF (`dart_pdf` cae a
  # Helvetica Latin-1 si no se registra una TTF: las tildes y la ñ salen rotas).
  # Roboto se distribuye bajo Apache-2.0 y viaja dentro del APK, así que los
  # reportes funcionan también sin señal en obra.
  assets:
    - assets/fonts/
